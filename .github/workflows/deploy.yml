name: Deploy ConnorHub

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Update production repository
        run: |
          cd /home/concon/ConnorHub
          git fetch origin
          git reset --hard origin/main

      - name: Install dependencies
        run: |
          cd /home/concon/ConnorHub/dashboard
          npm ci

      - name: Build ConnorHub
        run: |
          cd /home/concon/ConnorHub/dashboard
          npm run build

      - name: Restart ConnorHub
        run: |
          sudo systemctl restart connorhub.service
